<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Correction typographique</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 2em;
}
textarea {
    width: 100%;
    height: 200px;
}
#output {
    white-space: pre-wrap;
    margin-top: 1em;
    padding: 1em;
    border: 1px solid #ccc;
}
</style>
</head>
<body>
<h1>Correcteur de typographie</h1>
<textarea id="input" placeholder="Collez votre texte ici"></textarea>
<br>
<button id="corriger">Corriger les typos</button>
<div id="output"></div>
<script>
function corrigerTypos(text) {
    // Remplace les points de suspension
    text = text.replace(/\.\.\./g, '…');
    // Espaces insécables avant la ponctuation
    text = text.replace(/\s+([;!?:»])/g, '\u00A0$1');
    text = text.replace(/([«])\s+/g, '$1\u00A0');
    // Réduction des espaces multiples
    text = text.replace(/ {2,}/g, ' ');
    return text;
}

document.getElementById('corriger').addEventListener('click', function() {
    var input = document.getElementById('input').value;
    var output = corrigerTypos(input);
    document.getElementById('output').textContent = output;
});
</script>
</body>
</html>
